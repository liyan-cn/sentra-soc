defaults:
  window_seconds: 300
  warn_threshold: 50
  block_threshold: 100
  block_minutes: 10000
rules:
  HUAWEI_WAF:
    window_seconds: 30
    warn_threshold: 10
    block_threshold: 30
  HUAWEI_IPS:
    window_seconds: 30
    warn_threshold: 10
    block_threshold: 30
  DPTECH_WAF:
    window_seconds: 300
    warn_threshold: 50
    block_threshold: 100
  DPTECH_IPS:
    window_seconds: 30
    warn_threshold: 500
    block_threshold: null
  TOPSEC_WAF:
    window_seconds: 300
    warn_threshold: 50
    block_threshold: 100

