name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit cyclonedx-bom
      - run: python -m pip install .
      - run: pip-audit --strict
      - run: cyclonedx-py environment --output-format JSON --output-file monitor3-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: monitor3-sbom
          path: monitor3-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install bandit[toml]
      - run: bandit -q -r src -x tests
